apps:
  - script: index.js
    name: 'api-app'
    ignore_watch: 
      - "node_modules"
    watch_delay: 1000
    watch:
      - "../" 
    env:
      NODE_ENV: development
      APP_MODE: api
      PORT_HTTP: 2080
      PORT_HTTPS: 3000
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: volcanoes